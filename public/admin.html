<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#06305f">
<title>관리자 · 한수원 뉴스 스크랩</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#06305f;--blue:#0a5eb0;--bg:#eef3f9;--card:#fff;--tx:#14202e;--mut:#5b6b7d;--bd:#d9e3ee;--ac:#0a5eb0;--ok:#12a150;--warn:#e39200;--bad:#d93a3f}
@media(prefers-color-scheme:dark){:root{--bg:#0b1520;--card:#12202f;--tx:#e6eef7;--mut:#93a4b8;--bd:#1f3347;--ac:#5aa9f0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 Pretendard,"Malgun Gothic",system-ui,sans-serif}
header{background:linear-gradient(120deg,var(--navy),#0f7fc4);color:#fff;padding:16px}header .in{max-width:860px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0}header a,header button{color:#fff;font:inherit;font-size:13px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:6px 12px;cursor:pointer;text-decoration:none}
main{max-width:860px;margin:0 auto;padding:16px 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px}label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input[type=text],input[type=password],input[type=url],input[type=number],input[type=datetime-local]{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 12px;font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
button.b{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 14px;font:inherit;font-weight:700;cursor:pointer}
button.b.p{background:var(--ac);border-color:var(--ac);color:#fff}button.b.d{color:var(--bad);border-color:var(--bad)}button.b:disabled{opacity:.5}
.prev{margin-top:8px;max-width:100%;max-height:160px;border-radius:10px;border:1px solid var(--bd);display:none}
.it{display:flex;gap:12px;align-items:flex-start}.it img{width:140px;max-height:90px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);flex:0 0 auto}
.it .t{flex:1;min-width:0}.it b{display:block;word-break:break-all}.it small{color:var(--mut);display:block;word-break:break-all}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:1px 9px;color:#fff;margin-right:6px}.on{background:var(--ok)}.wait{background:var(--blue)}.off{background:#8a97a6}.end{background:var(--warn)}
.acts{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}.msg{font-size:13.5px;margin-top:10px}.err{color:var(--bad)}.okc{color:var(--ok)}
pre{background:rgba(127,127,127,.12);border-radius:10px;padding:12px;overflow:auto;font-size:12.5px}.hint{font-size:12.5px;color:var(--mut)}
@media(max-width:560px){.it{flex-direction:column}.it img{width:100%;max-height:140px}}
</style></head><body>
<header><div class="in"><h1>🔐 관리자 · 광고 배너</h1><span><a href="/">← 앱으로</a> <button id="out" hidden>로그아웃</button></span></div></header>
<main id="m"><div class="card">불러오는 중…</div></main>
<script>
const $=id=>document.getElementById(id),m=$('m');
const el=(t,a,...k)=>{const e=document.createElement(t);for(const x in a||{}){const v=a[x];typeof v==='function'?e[x]=v:x==='class'?e.className=v:x==='text'?e.textContent=v:x==='value'?e.value=v:e.setAttribute(x,v)}k.flat().forEach(c=>e.append(c));return e};
async function api(op,data,method){
 const r=await fetch('/api/admin?op='+op,{method:method||(data?'POST':'GET'),headers:data?{'Content-Type':'application/json'}:{},body:data?JSON.stringify(data):undefined});
 let j={};try{j=await r.json()}catch(e){}j._status=r.status;return j}

const SQL=`create table if not exists public.banners (
  id bigint generated always as identity primary key,
  caption text default '',
  image_url text not null,
  link_url text default '',
  active boolean not null default true,
  start_at timestamptz,
  end_at timestamptz,
  sort int not null default 0,
  created_at timestamptz not null default now()
);
alter table public.banners enable row level security;  -- 정책을 만들지 않아 공개 키로는 접근할 수 없음(서버 키로만 접근)
insert into storage.buckets (id, name, public) values ('banners','banners',true) on conflict (id) do nothing;`;

function setup(miss){
 m.replaceChildren(el('div',{class:'card'},el('h2',{text:'⚙ 설정이 필요합니다'}),
  el('p',{text:'Vercel 프로젝트의 Settings → Environment Variables 에 아래 값을 추가하고 Redeploy 하세요.'}),
  el('pre',{text:miss.map(x=>x+(x==='ADMIN_PASSWORD'?'   = (관리자 비밀번호. 길고 추측하기 어렵게)':x==='SUPABASE_URL'?'   = https://<프로젝트>.supabase.co':'   = (Supabase → Project Settings → API Keys 의 service_role 키. 절대 공개하지 마세요)')).join('\n')}),
  el('p',{text:'Supabase 의 SQL Editor 에서 아래를 한 번 실행하면 저장소(표 + 이미지 보관함)가 만들어집니다.'}),el('pre',{text:SQL})))}

function login(msg){
 const pw=el('input',{type:'password',placeholder:'관리자 비밀번호',autocomplete:'current-password'}),e=el('div',{class:'msg err',text:msg||''});
 const go=async()=>{e.textContent='';const r=await api('login',{password:pw.value});r.ok?start():e.textContent=r.error||'로그인 실패'};
 pw.onkeydown=ev=>{if(ev.key==='Enter')go()};
 m.replaceChildren(el('div',{class:'card'},el('h2',{text:'로그인'}),pw,el('div',{style:'margin-top:10px'},el('button',{class:'b p',text:'로그인',onclick:go})),e));pw.focus()}

const fmt=s=>s?new Date(s).toLocaleString('ko-KR',{dateStyle:'medium',timeStyle:'short'}):'';
const toLocal=s=>{if(!s)return'';const d=new Date(s),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`};
function status(b){const n=Date.now();if(!b.active)return['off','숨김'];if(b.start_at&&new Date(b.start_at)>n)return['wait','예약'];if(b.end_at&&new Date(b.end_at)<n)return['end','종료'];return['on','노출중']}

/* 이미지 파일 -> 가로 1200px 이하로 줄인 JPEG (GIF 는 그대로). 업로드가 가볍고 빠르다 */
function readImage(file){return new Promise((ok,no)=>{
 if(file.type==='image/gif'){const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file);return}
 const img=new Image(),u=URL.createObjectURL(file);
 img.onload=()=>{const w=Math.min(1200,img.width),h=Math.round(img.height*w/img.width),c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.85))};
 img.onerror=()=>no(new Error('이미지를 읽을 수 없습니다'));img.src=u})}

let list=[],editing=null;
function form(b){
 b=b||{};let img=null;
 const f={cap:el('input',{type:'text',maxlength:100,placeholder:'예: 겸직금지 (선택)'}),link:el('input',{type:'url',placeholder:'https://…  (누르면 이동할 주소, 선택)'}),
  file:el('input',{type:'file',accept:'image/*'}),url:el('input',{type:'url',placeholder:'또는 이미지 주소(https://…)'}),
  act:el('input',{type:'checkbox'}),s:el('input',{type:'datetime-local'}),e:el('input',{type:'datetime-local'}),sort:el('input',{type:'number',placeholder:'0',value:b.sort||0})};
 const pv=el('img',{class:'prev',alt:'미리보기'}),msg=el('div',{class:'msg'});
 f.cap.value=b.caption||'';f.link.value=b.link_url||'';f.act.checked=b.active!==false;f.s.value=toLocal(b.start_at);f.e.value=toLocal(b.end_at);
 if(b.image_url){pv.src=b.image_url;pv.style.display='block'}
 f.file.onchange=async()=>{const x=f.file.files[0];if(!x)return;try{img=await readImage(x);pv.src=img;pv.style.display='block';f.url.value=''}catch(e){msg.className='msg err';msg.textContent=e.message}};
 f.url.oninput=()=>{if(f.url.value){pv.src=f.url.value;pv.style.display='block';img=null}};
 const save=el('button',{class:'b p',text:b.id?'수정 저장':'배너 등록'});
 save.onclick=async()=>{save.disabled=true;msg.className='msg';msg.textContent='저장 중…';
  const d={id:b.id,caption:f.cap.value,link_url:f.link.value,active:f.act.checked,sort:f.sort.value,
   start_at:f.s.value?new Date(f.s.value).toISOString():'',end_at:f.e.value?new Date(f.e.value).toISOString():''};
  if(img)d.image_data=img;else if(f.url.value)d.image_url=f.url.value;
  const r=await api('save',d);save.disabled=false;
  if(r.banner){editing=null;await refresh('저장했습니다')}else{msg.className='msg err';msg.textContent=r.error||'저장 실패';if(r._status===401)login('다시 로그인하세요')}};
 const L=(t,n)=>[el('label',{text:t}),n];
 return el('div',{class:'card'},el('h2',{text:b.id?'배너 수정':'새 배너 등록'}),
  ...L('이미지 (가로 1200px 정도의 가로로 긴 이미지 권장. 자동으로 줄여서 올립니다)',f.file),f.url,pv,
  ...L('문구 (이미지 아래에 작게 표시됩니다)',f.cap),...L('이동 주소',f.link),
  el('div',{class:'row'},el('div',{},...L('노출 시작 (비우면 바로)',f.s)),el('div',{},...L('노출 종료 (비우면 계속)',f.e))),
  el('div',{class:'row'},el('div',{},...L('순서 (작을수록 먼저)',f.sort)),el('div',{},el('label',{text:'노출'}),el('label',{style:'display:flex;gap:8px;align-items:center;color:var(--tx)'},f.act,'화면에 보이기'))),
  el('div',{class:'acts',style:'margin-top:14px'},save,b.id?el('button',{class:'b',text:'취소',onclick:()=>{editing=null;draw()}}):''),msg)}

function draw(note){
 const items=list.map(b=>{const[st,lb]=status(b);
  return el('div',{class:'card'},el('div',{class:'it'},el('img',{src:b.image_url,alt:'',loading:'lazy'}),el('div',{class:'t'},
   el('div',{},el('span',{class:'tag '+st,text:lb}),el('b',{text:b.caption||'(문구 없음)',style:'display:inline'})),
   el('small',{text:b.link_url||'(이동 주소 없음)'}),
   el('small',{text:'순서 '+b.sort+(b.start_at?' · 시작 '+fmt(b.start_at):'')+(b.end_at?' · 종료 '+fmt(b.end_at):'')}),
   el('div',{class:'acts'},
    el('button',{class:'b',text:'수정',onclick:()=>{editing=b.id;draw();scrollTo(0,0)}}),
    el('button',{class:'b',text:b.active?'숨기기':'보이기',onclick:async()=>{const r=await api('save',{...b,image_url:undefined,active:!b.active});r.banner?refresh():alert(r.error)}}),
    el('button',{class:'b d',text:'삭제',onclick:async()=>{if(!confirm('이 배너를 삭제할까요? 올린 이미지도 함께 지워집니다.'))return;const r=await api('delete',{id:b.id});r.ok?refresh('삭제했습니다'):alert(r.error)}})))))});
 m.replaceChildren(note?el('div',{class:'msg okc',text:note}):'',editing?form(list.find(x=>x.id===editing)):form(),
  el('h2',{text:'등록된 배너 ('+list.length+')',style:'margin:18px 0 10px'}),...(items.length?items:[el('div',{class:'card hint',text:'아직 등록된 배너가 없습니다.'})]),
  el('p',{class:'hint',text:'화면에는 "노출중" 배너만 순서대로 표시되며, 변경은 1분 안에 모든 방문자 화면에 반영됩니다. 배너가 2개 이상이면 돌아가며 보여 줍니다.'}))}

async function refresh(note){const r=await api('list');if(r._status===401)return login();if(r.error)return m.replaceChildren(el('div',{class:'card msg err',text:r.error}));list=r.banners;draw(note)}
async function start(){
 const me=await api('me');
 if(me._status===503)return setup(me.missing||[]);
 $('out').hidden=false;$('out').onclick=async()=>{await api('logout',{});location.reload()};
 me.ok?refresh():login()}
start();
</script></body></html>
